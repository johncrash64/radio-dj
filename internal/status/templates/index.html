<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe6d2">
<meta name="description" content="24/7 AI-DJ radio — self-hosted personal station">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RADIO·DJ">
<title>RADIO-DJ</title>
<style>
  /* ── Fuentes: 3 familias unificadas (neo-brutalismo) ── */
  @font-face{
    font-family:'Permanent Marker'; font-style:normal; font-weight:400;
    font-display:block; src:url(/font/permanent-marker.woff2) format('woff2');
  }
  :root{
    --font-ui:'Helvetica Neue',Arial,sans-serif;   /* cuerpo neo-brutalista */
    --font-mono:'Courier New',Courier,monospace;     /* remarcadores/tecnico */
    --font-hand:'Permanent Marker',cursive;           /* etiqueta manuscrita */
    --bg:#efe6d2; --paper:#f7efdc; --ink:#221c16; --soft:#6b5d4a;
    --line:#221c16; --rose:#e6a08c; --sage:#9bbf94; --gold:#e8c464;
    --onair:#d6453a; --hist:#9a7b3e;
    --song:0; --flow:-34px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{ background:var(--bg); color:var(--ink);
    font-family:var(--font-ui);
    display:flex; flex-direction:column; align-items:center;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
           max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
    background-image:linear-gradient(var(--bg),var(--bg)),
      repeating-linear-gradient(0deg, rgba(34,28,22,.04) 0 2px, transparent 2px 28px),
      repeating-linear-gradient(90deg, rgba(34,28,22,.04) 0 2px, transparent 2px 28px);
  }
  .stack{ width:100%; max-width:540px; margin:auto; display:grid; gap:14px; }
  .blk{ background:var(--paper); border:3px solid var(--line); box-shadow:6px 6px 0 var(--line); min-width:0; }

  /* ── Barra superior ── */
  .bar{ display:flex; align-items:stretch; }
  .bar > *{ padding:12px 14px; display:flex; align-items:center; gap:8px; font-weight:800; text-transform:uppercase; letter-spacing:2px; }
  .brand{ background:var(--gold); border-right:3px solid var(--line); font-size:15px; flex:0 0 auto; }
  .freq{ background:var(--paper); border-right:3px solid var(--line); color:var(--soft); flex:0 0 auto; }
  .onair{ margin-left:auto; background:var(--paper); }
  .led{ width:14px; height:14px; background:#c9bda8; border:2px solid var(--line); }
  .playing .led{ background:var(--onair); animation:blk 1s steps(2) infinite; }
  @keyframes blk{ 50%{ background:var(--paper); } }
  .playing .onair{ background:var(--onair); color:#fff; }
  .playing .led{ border-color:#fff; }

  /* ── Barra "ahora suena" (el título vive en la etiqueta del casete) ── */
  .card{ padding:0; overflow:hidden; }
  .card-bot{ position:relative; background:#e05d2b; padding:8px 13px 10px; display:flex; justify-content:space-between; align-items:center; }
  .card-tag{ font-size:10px; font-weight:900; letter-spacing:1.8px; color:#fff5e6; text-transform:uppercase; }
  .card-time{ font-size:11px; font-weight:800; color:#fff5e6; font-family:var(--font-mono); letter-spacing:1px; }
  .songbar{ position:absolute; left:0; bottom:0; height:4px; width:100%; background:rgba(70,20,0,.32); }
  .songbar i{ display:block; height:100%; width:calc(var(--song,0) * 100%); background:#fff2dd; transition:width .9s linear; }
  /* ecualizador reutilizado en la etiqueta SVG (ver abajo) */
  .eq-bars i{ animation:eqb .7s steps(4) infinite alternate; transform-origin:bottom; }
  .eq-bars i:nth-child(2){animation-delay:.12s}.eq-bars i:nth-child(3){animation-delay:.24s}
  .eq-bars i:nth-child(4){animation-delay:.36s}
  @keyframes eqb{ to{ transform:scaleY(2.4); } }

  /* ── Casete ── */
  .cass-wrap{ perspective:1600px; }
  .flipper{ transform-style:preserve-3d; will-change:transform; }
  .cass{ display:block; width:100%; height:auto; filter:drop-shadow(6px 6px 0 var(--line)); backface-visibility:hidden; }

  .tape-shadow{ fill:none; stroke:#000; stroke-width:3.4; opacity:.20; }
  .tape-body{ fill:none; stroke:#2b1f12; stroke-width:2.3; }
  .tape-gloss{ fill:none; stroke:#6b512f; stroke-width:.9; opacity:.7; }
  .tape-sheen{ fill:none; stroke:#f0dcb8; stroke-width:2; opacity:0; stroke-dasharray:2 34; }
  .playing .tape-sheen{ opacity:.30; animation:flow .85s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:var(--flow); } }
  .pack-edge{ fill:none; stroke:#d8c49a; stroke-width:1.4; opacity:.45; }
  /* etiqueta de papel encolada sobre la ventana */
  .paper-label{ fill:#f3ead2; }
  .label-line{ stroke:#c4b48c; stroke-width:.7; }
  .label-marker{ font-family:var(--font-hand); fill:#2b2118; }
  .label-marker.big{ font-size:15px; }
  .label-marker.small{ font-size:9px; fill:#6a5a44; }
  .label-marker.bpm{ font-size:7.5px; fill:#9a7b3e; letter-spacing:.3px; }
  .label-side{ font-family:var(--font-hand); font-size:16px; fill:#c8443a; }
  #next-label text{ font-family:var(--font-hand); }
  .shell-print{ font:800 11px var(--font-ui); letter-spacing:2.6px; fill:#5a5346; }
  .shell-side{ font:900 16px var(--font-ui); fill:#161009; }

  /* ── Botonera tipo cassettera ── */
  .deck-panel{ margin-top:14px; background:#cfc7b5; border:3px solid var(--line); box-shadow:6px 6px 0 var(--line); padding:10px 12px 12px; }
  .keys{ display:flex; gap:8px; }
  .key{ flex:1; position:relative; border:0; background:none; padding:0; cursor:pointer; font-family:inherit;
    perspective:280px; -webkit-tap-highlight-color:transparent; }
  .key:focus-visible{ outline:3px solid var(--onair); outline-offset:3px; }
  /* bloque físico de la tecla */
  .key .cap{ position:relative; height:64px; border:3px solid var(--line); background:#e9e3d4;
    box-shadow:0 6px 0 #8f8672, 0 8px 0 var(--line);
    transition:transform .15s cubic-bezier(.2,.85,.3,1), box-shadow .15s cubic-bezier(.2,.85,.3,1), background .15s ease-out;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:9px; overflow:hidden; }
  /* textura de rejilla */
  .key .cap::before{ content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:radial-gradient(rgba(34,28,22,.5) 0.5px, transparent 0.6px);
    background-size:4px 4px; }
  .key .ico{ font-size:13px; font-weight:900; color:var(--ink); letter-spacing:1px; z-index:1; line-height:1; }
  .key .txt{ font-size:8px; font-weight:900; letter-spacing:1px; color:#5a5346; margin-top:3px; z-index:1; text-transform:uppercase; }
  /* tira de color inferior */
  .key .strip{ position:absolute; left:0; right:0; bottom:0; height:13px; border-top:2px solid var(--line); z-index:1; }
  .k-stop  .strip{ background:#5b8aa6; }
  .k-ffwd  .strip,.k-rew .strip{ background:#efe8d6; }
  .k-play  .strip{ background:var(--sage); }
  .k-rec   .strip{ background:var(--onair); }
  /* pulsado / enclavado: se hunde */
  .key:active .cap,.key.down .cap{ transform:translateY(6px); box-shadow:0 1px 0 #8f8672, 0 2px 0 var(--line); }
  .key.down .cap{ background:#ded7c6; }
  .key.k-play.down .ico,.key.k-play.down .txt{ color:#1f3a1c; }
  .key.k-rec.down  .cap{ background:#f2c9bf; }
  .key.k-rec.down .strip{ animation:recblink 1.4s ease-in-out infinite; }
  @keyframes recblink{ 50%{ background:#7a1f16; } }
  .key.connecting .cap{ animation:keypulse 1s steps(2) infinite; }
  @keyframes keypulse{ 50%{ background:#c9bda8; } }
  .key .dots{ display:inline-flex; gap:2px; }
  .key .dots i{ width:4px; height:4px; background:var(--ink); border-radius:50%; animation:bounce .6s steps(2) infinite alternate; }
  .key .dots i:nth-child(2){animation-delay:.15s}.key .dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{ to{ opacity:.3; } }

  /* ── Pestañas tipo bricks neo-brutalistas (separadas, cada una con su color) ── */
  .tab-bar{ display:flex; gap:5px; margin:8px 5px 0; position:relative; z-index:2; }
  .tab{ flex:1; padding:10px 4px 12px; border:3px solid var(--line); cursor:pointer;
    font-family:inherit; font-size:10px; font-weight:900; letter-spacing:.8px; text-transform:uppercase;
    white-space:nowrap; position:relative;
    box-shadow:3px 3px 0 var(--line);
    transition:transform .08s ease-out, box-shadow .08s ease-out, background .12s;
    -webkit-tap-highlight-color:transparent; }
  /* cada tab tiene su color siempre — inactiva oscurecida */
  .tab[data-tab="history"]{ background:#6b5530; color:#d4c4a0; }
  .tab[data-tab="djlog"]{ background:#5e7a5a; color:#c4d4c0; }
  .tab[data-tab="reqs"]{ background:#a07060; color:#e8c4b8; }
  /* activa = color a saturación full + levantada (folder tab) */
  .tab.active{ transform:translateY(-4px); box-shadow:4px 5px 0 var(--line); z-index:3; }
  .tab.active[data-tab="history"]{ background:var(--hist); color:#fff5e6; }
  .tab.active[data-tab="djlog"]{ background:var(--sage); color:#1f3a1c; }
  .tab.active[data-tab="reqs"]{ background:var(--rose); color:#6b2e22; }
  .tab:not(.active):active{ transform:translateY(1px); box-shadow:2px 2px 0 var(--line); }
  .tab .badge{ display:inline-block; min-width:15px; padding:1px 4px; margin-left:4px; border-radius:8px;
    background:var(--onair); color:#fff5e6; font-size:7px; line-height:1.5; vertical-align:middle; font-weight:900; }
  .tab-panel{ margin-top:-3px; position:relative; z-index:1; }
  .tab-body{ padding:12px 14px; }
  .tab-body[hidden]{ display:none; }
  .tab-body ul{ margin:0; list-style:none; }
  .tab-body li{ font-family:var(--font-mono); font-size:11px; line-height:1.6; font-weight:700; padding:3px 0; color:var(--soft); border-top:1px dashed #d8ccb3; }
  .tab-body li:first-child{ border-top:none; }
  .tab-body li b{ color:var(--ink); font-weight:900; }
  .tab-body .empty{ font-size:11px; color:var(--soft); padding:2px 0; font-weight:600; border:none; }
  .djlog pre{ margin:0; max-height:240px; overflow:auto; font-family:var(--font-mono); font-size:11px; line-height:1.6; color:#5a4a36; white-space:pre-wrap; word-break:break-word; }
  .djlog pre b{ color:#7a6437; }

  .ask{ padding:14px; min-width:0; }
  .ask[hidden]{ display:none; }
  .ask{ animation:askin .25s ease-out; }
  @keyframes askin{ from{ opacity:0; transform:translateY(-6px); } }
  .ask-rec{ display:flex; align-items:center; gap:8px; font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--onair); margin-bottom:10px; }
  .rec-dot{ width:11px; height:11px; border-radius:50%; background:var(--onair); border:2px solid var(--line); animation:recpulse 1s steps(2) infinite; }
  @keyframes recpulse{ 50%{ opacity:.25; } }
  .ask form{ display:flex; flex-wrap:wrap; }
  .ask input{ padding:12px 13px; border:3px solid var(--line); background:#fff; color:var(--ink); font-family:var(--font-mono); font-size:13px; font-weight:700; min-width:0; }
  .ask input::placeholder{ font-family:var(--font-mono); font-weight:600; color:#9a8a72; }
  #q-from{ flex:1 1 100%; border-bottom-width:0; }
  #q-from:focus{ outline:none; background:#fffdf3; }
  #q{ flex:1; border-right:none; }
  #q:focus{ outline:none; background:#fffdf3; }
  .ask button{ padding:0 20px; border:3px solid var(--line); background:var(--rose); color:var(--ink); font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:1px; cursor:pointer; }
  .ask button:active{ transform:translate(2px,2px); }
  .ask .h{ font-size:11px; color:var(--soft); margin-top:8px; font-weight:700; }

  .onair .lst{ margin-left:7px; padding:2px 7px; background:var(--ink); color:var(--gold);
    font-family:var(--font-mono); font-size:11px; font-weight:800; border:2px solid var(--line); }

  @media (max-width:480px){
    .stack{ gap:11px; }
    .blk{ box-shadow:4px 4px 0 var(--line); }
    .cass{ filter:drop-shadow(4px 4px 0 var(--line)); }
    .bar > *{ padding:10px 11px; letter-spacing:1.5px; }
    .brand{ font-size:13px; }
    .deck-panel{ margin-top:11px; }
  }
  @media (max-width:360px){
    .bar > *{ padding:9px 8px; letter-spacing:1px; font-size:12px; }
    .brand{ font-size:12px; }
    .stack{ gap:9px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="stack" id="deck">
    <div class="blk bar">
      <span class="brand">RADIO·DJ</span>
      <span class="freq">88.7</span>
      <span class="onair"><span class="led"></span> ON AIR<span class="lst" id="lst" hidden><b id="listeners-count">0</b></span></span>
    </div>

    <div class="blk card">
      <div class="card-bot">
        <span class="card-time"><span id="elapsed">0:00</span> / <span id="dur-total">0:00</span></span>
        <div class="songbar" id="prog" style="display:none"><i></i></div>
      </div>
    </div>

    <div class="cass-wrap">
      <div class="flipper" id="flipper">
        <!-- Casete a escala real: 100 x 64 mm  ->  400 x 256 u  (1 mm = 4 u) -->
        <svg class="cass" viewBox="0 0 400 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{.AriaCassette}}">
          <defs>

            <!-- rollo de cinta: r 48 (vacío) … 90 (lleno) -->
            <g id="packArt">
              <circle r="90" fill="#161009"/>
              <g fill="none" stroke="#3a2c1a" stroke-width=".8" opacity=".55">
                <circle r="54"/><circle r="60"/><circle r="66"/><circle r="72"/>
                <circle r="78"/><circle r="83"/><circle r="87"/><circle r="89.4"/>
              </g>
              <path d="M0,-46 L0,-89.4" stroke="#4a3a24" stroke-width="1.6" opacity=".4"/>
            </g>

            <!-- bobina estilo referencia: brida + 5 radios + engranaje central + arco rojo -->
            <g id="hubArt">
              <circle r="44" fill="#cbc4b2" stroke="#161009" stroke-width="2"/>
              <!-- arco rojo (punto de amarre de la cinta) -->
              <path d="M -32,18.5 A 37 37 0 0 1 -32,-18.5" fill="none" stroke="#d6453a" stroke-width="8" stroke-linecap="round"/>
              <!-- 5 aberturas entre radios -->
              <g fill="#2a2118">
                <path d="M0,0 L27,-9 A28.5 28.5 0 0 1 27,9 Z"/>
                <path d="M0,0 L27,-9 A28.5 28.5 0 0 1 27,9 Z" transform="rotate(72)"/>
                <path d="M0,0 L27,-9 A28.5 28.5 0 0 1 27,9 Z" transform="rotate(144)"/>
                <path d="M0,0 L27,-9 A28.5 28.5 0 0 1 27,9 Z" transform="rotate(216)"/>
                <path d="M0,0 L27,-9 A28.5 28.5 0 0 1 27,9 Z" transform="rotate(288)"/>
              </g>
              <circle r="30" fill="none" stroke="#8f8672" stroke-width="1.4"/>
              <!-- engranaje central de arrastre -->
              <circle r="20" fill="#cbc4b2" stroke="#161009" stroke-width="1.6"/>
              <circle r="15" fill="#161009"/>
              <g fill="#cbc4b2">
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1"/>
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1" transform="rotate(60)"/>
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1" transform="rotate(120)"/>
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1" transform="rotate(180)"/>
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1" transform="rotate(240)"/>
                <rect x="-2.8" y="-15.5" width="5.6" height="6" rx="1" transform="rotate(300)"/>
              </g>
            </g>

            <!-- guía de cinta de esquina -->
            <g id="guideArt">
              <circle r="8" fill="#161009" stroke="#8f8672" stroke-width="1.6"/>
              <circle r="3" fill="#8f8672"/>
            </g>

            <g id="screwArt">
              <circle r="8" fill="#d9d2c2" stroke="#161009" stroke-width="2"/>
              <path d="M-3.8,-3.8 L3.8,3.8 M3.8,-3.8 L-3.8,3.8" stroke="#161009" stroke-width="2"/>
            </g>

            <!-- carcasa: rectángulo redondeado con la escotadura del cabezal -->
            <path id="shell" d="M14,1.5 H386 A12.5 12.5 0 0 1 398.5,14 V242 A12.5 12.5 0 0 1 386,254.5
                                 H14 A12.5 12.5 0 0 1 1.5,242 V14 A12.5 12.5 0 0 1 14,1.5 Z"/>
            <!-- ventana + escotadura que baja al canto inferior -->
            <path id="win" d="M30,30 H370 A10 10 0 0 1 380,40 V226 A10 10 0 0 1 370,236
                              H286 L290,256 H110 L114,236 H30 A10 10 0 0 1 20,226 V40 A10 10 0 0 1 30,30 Z"/>
            <clipPath id="cWin"><use href="#win"/></clipPath>
            <clipPath id="cL"><circle id="clipL" cx="121" cy="118" r="90"/></clipPath>
            <clipPath id="cR"><circle id="clipR" cx="279" cy="118" r="48"/></clipPath>
          </defs>

          <!-- ── carcasa (plana, borde negro grueso) ── -->
          <use href="#shell" fill="#bdb6a6" stroke="#161009" stroke-width="4"/>
          <!-- rebajes de las lengüetas de protección (canto superior) -->
          <path d="M12,3 h30 v11 h-30 z M358,3 h30 v11 h-30 z" fill="#161009" opacity=".18"/>

          <!-- ── ventana (interior plano) ── -->
          <use href="#win" fill="#8a8579"/>

          <g clip-path="url(#cWin)">
            <!-- bobina izquierda: SUMINISTRO (se vacía) -->
            <g clip-path="url(#cL)"><g id="reelL">
              <use href="#packArt" x="121" y="118"/><use href="#hubArt" x="121" y="118"/>
            </g></g>

            <!-- bobina derecha: RECOGIDA (se llena) -->
            <g clip-path="url(#cR)"><g id="reelR">
              <use href="#packArt" x="279" y="118"/><use href="#hubArt" x="279" y="118"/>
            </g></g>

            <!-- poste central de la carcasa -->
            <circle cx="200" cy="182" r="9" fill="#bdb6a6" stroke="#161009" stroke-width="2"/>
            <circle cx="200" cy="182" r="3.6" fill="#161009"/>

            <!-- guías de cinta -->
            <use href="#guideArt" x="35" y="226"/>
            <use href="#guideArt" x="365" y="226"/>

            <!-- cabezal + almohadilla (detrás de la cinta) -->
            <rect x="170" y="236" width="60" height="22" rx="2" fill="#161009" stroke="#8f8672" stroke-width="1.4"/>
            <rect x="176" y="240" width="48" height="6" rx="1.5" fill="#4c4636"/>
            <path d="M200,236 V258" stroke="#8f8672" stroke-width="1.2" opacity=".6"/>
            <path d="M200,232 V216" stroke="#8f8672" stroke-width="1.6" opacity=".7"/>
            <rect x="186" y="230" width="28" height="9" rx="2" fill="#7a715c" stroke="#161009" stroke-width="1.2"/>

            <!-- ── CINTA ── izquierda (suministro) → cabezal → derecha (recogida) -->
            <path class="tape-shadow" id="tapeShadow"/>
            <path class="tape-body"   id="tapePath"/>
            <path class="tape-gloss"  id="tapeGloss"/>
            <path class="tape-sheen"  id="tapeSheen"/>

            <!-- ── etiqueta de papel: carátula + título/artista a marcador ── -->
            <g id="paper" transform="rotate(-.6 200 66)">
              <rect class="paper-label" x="36" y="36" width="328" height="60" rx="3" stroke="#d9cba6" stroke-width="1"/>
              <rect x="36" y="36" width="328" height="60" rx="3" fill="none" stroke="#000" stroke-width="1" opacity=".06"/>
              <!-- carátula -->
              <clipPath id="cCover"><rect x="45" y="45" width="42" height="42" rx="2"/></clipPath>
              <rect id="cover-bg" x="45" y="45" width="42" height="42" rx="2" fill="#161009"/>
              <g id="cover-ph">
                <path d="M67,54 v18" stroke="#8f8672" stroke-width="2.4" fill="none"/>
                <circle cx="63" cy="72" r="4" fill="#8f8672"/>
                <path d="M67,54 l6,-2 v4 l-6,2 z" fill="#8f8672"/>
              </g>
              <image id="cover-img" x="45" y="45" width="42" height="42" clip-path="url(#cCover)"
                     preserveAspectRatio="xMidYMid slice" style="display:none"/>
              <rect x="45" y="45" width="42" height="42" rx="2" fill="none" stroke="#161009" stroke-width="2"/>
              <!-- texto -->
              <line class="label-line" x1="98" y1="63" x2="354" y2="63"/>
              <text class="label-side" x="352" y="52" text-anchor="end" id="paper-side">A</text>
              <text class="label-marker big"   x="99" y="56" id="paper-title">—</text>
              <text class="label-marker small" x="99" y="76" id="paper-artist"></text>
              <text class="label-marker bpm"   x="99" y="89" id="paper-bpm" style="display:none"></text>
            </g>

            <!-- ── etiqueta "Siguiente": sticker pequeño debajo de los rollos, sobre la cinta ── -->
            <g id="next-label" transform="rotate(.5 200 222)">
              <rect class="paper-label" x="96" y="208" width="208" height="24" rx="2" stroke="#d9cba6" stroke-width=".8"/>
              <rect x="96" y="208" width="208" height="24" rx="2" fill="none" stroke="#000" stroke-width=".6" opacity=".05"/>
              <text font-size="8" fill="#9a7b3e" x="104" y="217" letter-spacing=".5">{{.Next}}</text>
              <text font-size="11" fill="#2b2118" x="104" y="229" id="paper-next">—</text>
            </g>

          </g>

          <use href="#win" fill="none" stroke="#161009" stroke-width="3"/>

          <!-- ── canto inferior: aberturas (2 agujeros grandes + cuadrados + cabrestantes) ── -->
          <g fill="#161009" stroke="#161009" stroke-width="1">
            <circle cx="70"  cy="245" r="10"/>
            <circle cx="330" cy="245" r="10"/>
            <rect x="120" y="240" width="14" height="12" rx="2"/>
            <rect x="266" y="240" width="14" height="12" rx="2"/>
            <circle cx="158" cy="247" r="7"/>
            <circle cx="242" cy="247" r="7"/>
          </g>
          <g fill="#8f8672">
            <circle cx="70"  cy="245" r="4.5"/>
            <circle cx="330" cy="245" r="4.5"/>
          </g>

          <!-- ── tornillos + serigrafía ── -->
          <use href="#screwArt" x="20" y="18"/><use href="#screwArt" x="380" y="18"/>
          <use href="#screwArt" x="20" y="238"/><use href="#screwArt" x="380" y="238"/>
          <text class="shell-side" id="side-print" x="44" y="26">A</text>
          <text class="shell-print" x="356" y="25" text-anchor="end">TYPE I · NORMAL</text>
        </svg>
      </div>

      <div class="deck-panel">
        <div class="keys">
          <button class="key k-stop" id="k-stop" aria-label="Stop">
            <span class="cap"><span class="ico">■</span><span class="txt">Stop</span><span class="strip"></span></span>
          </button>
          <button class="key k-ffwd" id="k-ffwd" aria-label="{{.AriaFfwd}}">
            <span class="cap"><span class="ico">◀◀</span><span class="txt">{{.Previous}}</span><span class="strip"></span></span>
          </button>
          <button class="key k-play" id="k-play" aria-label="Play">
            <span class="cap"><span class="ico" id="play-ico">▶</span><span class="txt" id="play-txt">Play</span><span class="strip"></span></span>
          </button>
          <button class="key k-rew" id="k-rew" aria-label="{{.AriaRew}}">
            <span class="cap"><span class="ico">▶▶</span><span class="txt">{{.Skip}}</span><span class="strip"></span></span>
          </button>
          <button class="key k-rec" id="k-rec" aria-label="{{.AriaRec}}" aria-pressed="false">
            <span class="cap"><span class="ico">●</span><span class="txt">Rec</span><span class="strip"></span></span>
          </button>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="history">{{.TabHistory}}</button>
      <button class="tab" data-tab="djlog">{{.TabDJ}}</button>
      <button class="tab" data-tab="reqs">{{.TabRequests}}<span class="badge" id="req-badge" hidden>0</span></button>
    </div>
    <div class="blk tab-panel">
      <div class="tab-body" id="tab-history">
        <ul id="history-list"></ul>
      </div>
      <div class="tab-body djlog" id="tab-djlog" hidden>
        <pre id="djlog-body"></pre>
      </div>
      <div class="tab-body" id="tab-reqs" hidden>
        <ul id="reqlist"></ul>
      </div>
    </div>

    <div class="blk ask" id="ask" hidden>
      <div class="ask-rec"><span class="rec-dot"></span> {{.Recording}} — RDJ-0001</div>
      <form id="form">
        <input id="q-from" placeholder="{{.PhName}}" autocomplete="off" maxlength="20">
        <input id="q" placeholder="{{.PhRequest}}" autocomplete="off">
        <button type="submit">{{.Send}}</button>
      </form>
      <div class="h">{{.Hint}}</div>
    </div>
  </div>

<audio id="audio" preload="none"></audio>
<script type="application/json" id="i18n">{{.I18n}}</script>
<script>
  // PWA: register service worker for installability + offline app shell.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  // All UI strings JS needs live in the #i18n JSON island above — never
  // interpolated into this source, so any translated quote/apostrophe is safe.
  const T = JSON.parse(document.getElementById('i18n').textContent);
  const audio = document.getElementById('audio');
  // src is (re)assigned on every play so stop() can release it and free the
  // progressive-download buffer WebKit otherwise retains after a long session.
  function playStream(){ audio.src = '{{.StreamPath}}'; return audio.play(); }
  const $ = id => document.getElementById(id);
  const deck = $('deck');

  const kPlay = $('k-play'), kStop = $('k-stop'), kRec = $('k-rec'), kFfwd = $('k-ffwd'), kRew = $('k-rew');

  let audioState = 'idle';
  function setAudioState(s){
    audioState = s;
    if(s === 'playing'){
      $('play-ico').textContent = '▶'; $('play-txt').textContent = T.ui_playing;
      kPlay.classList.add('down'); kPlay.classList.remove('connecting');
      deck.classList.add('playing');
    } else if(s === 'connecting'){
      $('play-ico').innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      $('play-txt').textContent = T.ui_connecting;
      kPlay.classList.add('down','connecting');
      deck.classList.remove('playing');
    } else {
      $('play-ico').textContent = '▶'; $('play-txt').textContent = 'Play';
      kPlay.classList.remove('down','connecting');
      deck.classList.remove('playing');
    }
  }

  // REC = armar pedido (dedicatoria al locutor)
  function setRec(on){
    kRec.classList.toggle('down', on);
    kRec.setAttribute('aria-pressed', on ? 'true' : 'false');
    $('ask').hidden = !on;
    if(on) setTimeout(()=> $('q').focus(), 60);
  }

  kPlay.onclick = ()=>{
    if(audioState === 'idle'){
      setRec(false);
      setAudioState('connecting');
      playStream().catch(()=> setAudioState('idle'));
    }
  };
  kStop.onclick = ()=>{
    // Release the accumulated progressive-download buffer (currentTime is a no-op
    // on a live stream). Next play reassigns src via playStream().
    releaseSkipKey(); // Stop pops every transport key — the cassette "chunk"
    audio.pause(); audio.removeAttribute('src'); audio.load();
    setAudioState('idle'); setRec(false);
  };
  kRec.onclick = ()=> setRec(!kRec.classList.contains('down'));
  // Cassette transport keys: ◀◀ = previous, ▶▶ = next. Server-side they kill
  // the in-flight decoder (listeners stay connected). The key LATCHES down until
  // the skip actually lands (track change via SSE) — like a real deck key staying
  // engaged while it works — then springs back. ◀◀/▶▶ are mutually exclusive;
  // Stop releases every transport key.
  let engagedSkip = null; // {btn,timer} the latched skip key, or null when idle
  function releaseSkipKey(){
    if(!engagedSkip) return;
    clearTimeout(engagedSkip.timer);
    engagedSkip.btn.classList.remove('down');
    engagedSkip.btn.disabled = false;
    engagedSkip = null;
  }
  function control(action, button){
    if(button.disabled) return;
    releaseSkipKey(); // interlock: pressing a transport key releases the other
    button.disabled = true;
    button.classList.add('down');
    engagedSkip = { btn: button, timer: setTimeout(releaseSkipKey, 4000) };
    fetch('/control', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action})
    }).then(res=>{
      if(!res.ok) return res.text().then(t=>{ throw new Error(t); });
    }).catch(err=>{
      console.error('radio control failed', err);
      releaseSkipKey(); // 409 / network error → spring back at once
    });
  }
  kFfwd.onclick = ()=> control('previous', kFfwd);
  kRew.onclick = ()=> control('next', kRew);

  audio.addEventListener('playing', ()=> setAudioState('playing'));
  audio.addEventListener('pause',   ()=>{ if(audioState!=='idle') setAudioState('idle'); });

  let metaTitle='', metaArtist='';
  function updateMediaMeta(){
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: metaTitle, artist: metaArtist, album: 'RADIO-DJ 88.7',
      artwork: coverURL ? [{src: coverURL, sizes:'512x512', type:'image/jpeg'}] : []
    });
  }
  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play',  ()=> playStream());
    navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
  }

  let reconnectTimer = null;
  function reconnectStream(){
    if(reconnectTimer) return;
    setAudioState('idle');
    reconnectTimer = setTimeout(()=>{
      reconnectTimer = null;
      audio.src = '{{.StreamPath}}?t=' + Date.now();
      setAudioState('connecting');
      audio.play().catch(()=>{});
    }, 2500);
  }
  audio.addEventListener('error', reconnectStream);
  audio.addEventListener('ended', reconnectStream);

  // ── pestañas: Sonó antes / Locutor / Pedidos ──
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-body').forEach(b=> b.hidden = b.id !== 'tab-'+t.dataset.tab);
      t.classList.add('active');
    };
  });

  $('form').addEventListener('submit', async e=>{
    e.preventDefault();
    const q = $('q').value.trim(); if(!q) return;
    const from = $('q-from').value.trim();
    $('q').value=''; $('q-from').value='';
    try{ await fetch('/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from, text:q})}); refresh(); refreshDJLog(); }catch(_){}
    const h = $('ask').querySelector('.h'); const prev = h.textContent;
    h.textContent = T.ui_recorded_sent;
    setTimeout(()=>{ h.textContent = prev; setRec(false); }, 1400);
  });

  let startedAt = null, duration = null, coverTitle = null, coverURL = null;
  const BATCH_SIZE = 8;
  let lastTitle = null;
  let sideA = (localStorage.getItem('rdj_side') !== 'B');
  let batchIdx = parseInt(localStorage.getItem('rdj_batch') || '0', 10) || 0;
  function saveState(){ try{ localStorage.setItem('rdj_side', sideA?'A':'B'); localStorage.setItem('rdj_batch', String(batchIdx)); }catch(_){} }
  const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

  function applyNowPlaying(j){
    const c = j.current||{};
    if(c.title && c.title !== lastTitle){
      if(lastTitle !== null){
        batchIdx++;
        if(batchIdx >= BATCH_SIZE){ flipCassette(); batchIdx = 0; }
        saveState();
      }
      lastTitle = c.title;
      releaseSkipKey(); // a latched skip key just finished its job
    }
    metaTitle = c.title||''; metaArtist = c.artist||'';
    const clip = (s,n)=> s && s.length>n ? s.slice(0,n-1).trimEnd()+'…' : (s||'');
    $('paper-title').textContent  = clip(metaTitle,24) || '—';
    // Artist · Album · Year — only include non-empty parts
    const parts = [metaArtist, c.album, c.year].filter(Boolean).map(s=>clip(s,28));
    $('paper-artist').textContent = parts.join(' · ');
    // BPM line (hidden when tag absent)
    const bpmEl = $('paper-bpm');
    if(c.bpm && c.bpm !== '0'){
      bpmEl.textContent = c.bpm.replace(/\.\d+.*/, '') + ' BPM';
      bpmEl.style.display = '';
    } else {
      bpmEl.style.display = 'none';
    }
    const nx = j.next ? clip(j.next.title,16) + (j.next.artist ? ' — ' + clip(j.next.artist,10) : '') : '—';
    $('paper-next').textContent = nx;
    const rs = j.requests||[];
    $('reqlist').innerHTML = rs.length
      ? rs.map(r=>{
          const who = r.from ? '<b>'+esc(r.from)+'</b>: ' : '';
          return '<li>'+who+esc(r.text)+'</li>';
        }).join('')
      : '<li class="empty">'+T.ui_no_requests+'</li>';
    const rb = $('req-badge'); rb.hidden = rs.length===0; rb.textContent = rs.length;

    startedAt = j.startedAt ? Date.parse(j.startedAt) : null;
    duration = (typeof c.duration === 'number') ? c.duration : null;

    const l = (typeof j.listeners === 'number') ? j.listeners : 0;
    $('lst').hidden = l<1;
    $('listeners-count').textContent = l;

    const h = j.history||[];
    $('history-list').innerHTML = h.length
      ? h.slice(0,8).map(t=>'<li>'+esc(t.title)+(t.artist?(' — '+esc(t.artist)):'')+'</li>').join('')
      : '<li class="empty">'+T.ui_nothing_played+'</li>';

    if(c.title && c.title !== coverTitle){ coverTitle = c.title; loadCover(); }
    updateMediaMeta();
    tickProgress();
  }

  async function refresh(){
    try{ const j = await fetch('/now-playing').then(r=>r.json()); applyNowPlaying(j); }catch(_){}
  }

  async function refreshDJLog(){
    try{
      const entries = await fetch('/dj-log').then(r=>r.json());
      const pre = $('djlog-body');
      if(!entries.length){ pre.innerHTML = '<span class="empty">'+T.ui_no_djlog+'</span>'; return; }
      pre.innerHTML = entries.reverse().slice(0,120).map(e=>{
        const lbl = T['log_kind_'+e.kind] || e.kind;
        // legacy lines (no kind) are raw "HH:MM:SS [DJ] text" — show as-is;
        // structured entries render the localized kind label.
        const head = lbl ? esc(e.t)+' <b>['+lbl+']</b> ' : '';
        return head + esc(e.text);
      }).join('\n');
    }catch(_){}
  }

  function loadCover(){
    fetch('/cover').then(r=> r.ok ? r.blob() : Promise.reject()).then(b=>{
      if(coverURL) URL.revokeObjectURL(coverURL);
      coverURL = URL.createObjectURL(b);
      const img = $('cover-img');
      img.setAttributeNS('http://www.w3.org/1999/xlink','href', coverURL);
      img.setAttribute('href', coverURL);
      img.style.display = '';
      $('cover-ph').style.display = 'none';
      updateMediaMeta();
    }).catch(()=>{
      coverURL = null;
      $('cover-img').style.display = 'none';
      $('cover-ph').style.display = '';
    });
  }

  function flipCassette(){
    const fp = $('flipper');
    if(!fp) return;
    fp.style.transition = 'transform .4s cubic-bezier(.5,0,.7,.2)';
    fp.style.transform = 'rotateY(90deg) translateY(-6px)';
    setTimeout(()=>{
      sideA = !sideA;
      const letter = sideA ? 'A' : 'B';
      $('side-print').textContent = letter;
      $('paper-side').textContent = letter;
      angL = angR = 0; lastP = -1; applyReels(0);
      fp.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
      fp.style.transform = 'rotateY(0deg) translateY(0)';
      saveState();
    }, 400);
  }

  /* ══════════════ MECANISMO ══════════════
     viewBox 400 x 256 = 100 x 64 mm reales (1 mm = 4 u).
     Ejes separados 158 u (39,5 mm), guías al 8,7 % del ancho, rollo lleno
     Ø 39 mm — medidas tomadas de las fotos de referencia.

     Reproducción hacia adelante: la cinta corre de IZQUIERDA a DERECHA
     (el cabezal de borrado entra por la abertura izquierda, antes que el de
     lectura, y el cabrestante muerde a la derecha, después del cabezal).
     Por eso la bobina izquierda entrega cinta y la derecha la recoge, y las
     dos giran en el MISMO sentido, aquí antihorario.
     Si querés el sentido contrario, poné REVERSA = true.                     */
  const REVERSA = true;   // supply reel RIGHT, take-up LEFT, clockwise spin

  const HUB_L = {x:121, y:118}, HUB_R = {x:279, y:118};
  const GUI_L = {x:35,  y:226}, GUI_R = {x:365, y:226};
  const R_GUI = 8, R_MAX = 90, R_MIN = 48;
  const TAPE_Y = GUI_L.y + R_GUI;      // 234 — la cinta corre pegada al borde inferior
  const DSQ = R_MAX*R_MAX - R_MIN*R_MIN;
  const SPEED = 105;                   // u/s ≈ 4,76 cm/s reales
  const DEG = 180/Math.PI;
  const SPIN = REVERSA ? 1 : -1;       // -1 = antihorario
  let rL = R_MAX, rR = R_MIN, angL = 0, angR = 0;

  document.documentElement.style.setProperty('--flow', (REVERSA ? 34 : -34) + 'px');

  const n1 = v => Math.round(v*10)/10;

  // Tangente exterior común entre rollo (c1,r1) y guía (c2,r2):
  // la normal compartida cumple  d·n = r1 - r2  →  n = d̂ girado ±acos((r1-r2)/|d|).
  function tangent(c1, r1, c2, r2, side){
    const dx = c2.x-c1.x, dy = c2.y-c1.y, d = Math.hypot(dx,dy) || 1;
    const a = Math.atan2(dy,dx);
    const b = Math.acos(Math.max(-1, Math.min(1, (r1-r2)/d)));
    const u1 = a+b, u2 = a-b;
    const u = side < 0 ? (Math.cos(u1) < Math.cos(u2) ? u1 : u2)
                       : (Math.cos(u1) > Math.cos(u2) ? u1 : u2);
    return { p:{x:c1.x + r1*Math.cos(u), y:c1.y + r1*Math.sin(u)},
             q:{x:c2.x + r2*Math.cos(u), y:c2.y + r2*Math.sin(u)} };
  }

  // rollo → tramo recto → arco por FUERA de la guía → tramo del cabezal → guía → rollo
  // El extremo en el rollo se mete unos px hacia el centro (INSET) para que la cinta
  // se funda con el bobinado y no parezca cortada en punta.
  const INSET = 1.5;
  function inset(P, c){
    const dx = c.x - P.x, dy = c.y - P.y, d = Math.hypot(dx,dy) || 1;
    return { x: P.x + dx/d*INSET, y: P.y + dy/d*INSET };
  }
  function tapeD(a, b){
    const pa = inset(a.p, HUB_L), pb = inset(b.p, HUB_R);
    return `M ${n1(pa.x)},${n1(pa.y)} L ${n1(a.q.x)},${n1(a.q.y)}`
         + ` A ${R_GUI} ${R_GUI} 0 0 0 ${GUI_L.x},${TAPE_Y}`
         + ` L ${GUI_R.x},${TAPE_Y}`
         + ` A ${R_GUI} ${R_GUI} 0 0 0 ${n1(b.q.x)},${n1(b.q.y)}`
         + ` L ${n1(pb.x)},${n1(pb.y)}`;
  }

  let lastP = -1;
  function applyReels(p){
    p = Math.max(0, Math.min(1, p));
    if(Math.abs(p - lastP) < 0.0002) return;
    lastP = p;
    const vacia = Math.sqrt(Math.max(R_MIN*R_MIN, R_MAX*R_MAX - p*DSQ));
    const llena = Math.sqrt(Math.max(R_MIN*R_MIN, R_MIN*R_MIN + p*DSQ));
    rL = REVERSA ? llena : vacia;
    rR = REVERSA ? vacia : llena;
    $('clipL').setAttribute('r', rL.toFixed(2));
    $('clipR').setAttribute('r', rR.toFixed(2));
    const d = tapeD(tangent(HUB_L, rL, GUI_L, R_GUI, -1),
                    tangent(HUB_R, rR, GUI_R, R_GUI, +1));
    ['tapeShadow','tapePath','tapeGloss','tapeSheen'].forEach(id => $(id).setAttribute('d', d));
  }

  function currentP(){
    if(!startedAt || !duration) return Math.min(1, batchIdx / BATCH_SIZE);
    const el = (Date.now() - startedAt)/1000;
    const ps = Math.min(1, Math.max(0, el/duration));
    return Math.min(1, (batchIdx + ps) / BATCH_SIZE);
  }

  let lastTs = 0, frameN = 0;
  function frame(ts){
    const dt = lastTs ? Math.min(.05, (ts-lastTs)/1000) : 0;
    lastTs = ts;
    if(deck.classList.contains('playing')){
      angL = (angL + SPIN*(SPEED/rL)*dt*DEG) % 360;   // ω = v / r
      angR = (angR + SPIN*(SPEED/rR)*dt*DEG) % 360;
      $('reelL').setAttribute('transform', `rotate(${angL.toFixed(2)} ${HUB_L.x} ${HUB_L.y})`);
      $('reelR').setAttribute('transform', `rotate(${angR.toFixed(2)} ${HUB_R.x} ${HUB_R.y})`);
    }
    if((frameN++ % 6) === 0) applyReels(currentP());
    requestAnimationFrame(frame);
  }

  function tickProgress(){
    if(!startedAt || !duration){ $('prog').style.display='none'; return; }
    $('prog').style.display='';
    const el = (Date.now() - startedAt)/1000;
    document.documentElement.style.setProperty('--song', Math.min(1, Math.max(0, el/duration)).toFixed(4));
    $('elapsed').textContent = fmt(el);
    $('dur-total').textContent = fmt(duration);
  }

  $('side-print').textContent = sideA ? 'A' : 'B';
  $('paper-side').textContent = sideA ? 'A' : 'B';
  applyReels(batchIdx / BATCH_SIZE);
  requestAnimationFrame(frame);

  refresh();
  refreshDJLog();
  const es = new EventSource('events');
  es.onmessage = e => { try{ applyNowPlaying(JSON.parse(e.data)); }catch(_){} };
  setInterval(tickProgress, 1000);
  setInterval(refreshDJLog, 12000);
</script>
</body>
</html>
